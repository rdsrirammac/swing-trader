# Label definitions, applied via scripts/seed_github_labels.sh (uses `gh label create`).
# Edit here, then re-run the script -- it's idempotent (updates existing labels).

- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: SRS requirement not yet fully implemented
- name: feature-request
  color: "c5def5"
  description: New capability outside the original SRS
- name: good-first-issue
  color: "7057ff"
  description: Small, self-contained, good entry point
- name: blocked
  color: "b60205"
  description: Waiting on another issue/PR
- name: infra
  color: "5319e7"
  description: DB, scheduling, CI/CD, packaging

