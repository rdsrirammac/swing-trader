name: Feature request (out of SRS scope)
description: Something new that's not in the original SRS at all (e.g. a new data source, a new dashboard page).
title: "[Feature] "
labels: ["feature-request"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: What do you want to add?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Is there a config option or existing feature that already gets close to this?
    validations:
      required: false
