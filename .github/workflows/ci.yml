name: CI

# Lint + test on every push and PR. Keep this fast and dependency-light so
# it stays useful as a merge gate; heavier things (actually connecting to
# TimescaleDB, running a full backtest) are left to local `make` targets
# and are not part of this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy, non-blocking)
        run: mypy src || true

      - name: Unit + integration tests
        run: pytest --cov=src --cov-report=term-missing -v

      - name: Compile check (all modules importable)
        run: |
          python -m compileall -q src scheduler scripts

  schema-check:
    runs-on: ubuntu-latest
    # Verifies the SQLAlchemy schema is structurally valid SQL by creating
    # every table against a throwaway SQLite DB -- fast, no Postgres/
    # TimescaleDB service container required for this basic check. Real
    # hypertable conversion (scripts/init_db.py's create_hypertable calls)
    # is only exercised against a real TimescaleDB instance, which is out
    # of scope for CI; verify that manually via `make infra-up init-db`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install SQLAlchemy PyYAML python-dotenv pydantic
      - run: |
          PYTHONPATH=src python -c "
          from sqlalchemy import create_engine
          from swing_trader.db.base import Base
          from swing_trader.db import models
          engine = create_engine('sqlite:///:memory:')
          Base.metadata.create_all(engine)
          print(f'OK: {len(Base.metadata.tables)} tables created')
          "
